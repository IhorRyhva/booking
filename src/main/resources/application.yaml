spring:
  config:
    import: file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    database: postgresql
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Kyiv
          batch_size: 250
        order_updates: true
        order_inserts: true
        generate_statistics: true
  flyway:
    enabled: true
    callback-locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: book-client
            client-secret: ${CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/keycloak
        provider:
          keycloak:
            issuer-uri: http://localhost:8090/realms/booking
            user-name-attribute: preferred_username
  application:
    name: booking
    logout-url: http://localhost:8080/main
