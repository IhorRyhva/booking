spring:
  config:
    import: optional:file:.env[properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/booking?options=-c%20TimeZone=UTC
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: Europe/Kyiv
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: book-client
            client-secret: ${CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/keycloak
        provider:
          keycloak:
            issuer-uri: http://localhost:8090/realms/booking
            user-name-attribute: preferred_username
  application:
    name: booking
    logout-url: http://localhost:8080/main
