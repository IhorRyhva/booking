<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            margin-top: 18px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #e53935;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c62828;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
<div class="card">
    <h1>🏨 Admin Panel</h1>
    <div class="form-group">
        <label for="id">Hotel ID</label>
        <input
                id="id"
                name="id"
                type="number"
                placeholder="Enter hotel ID"
                required>
    </div>

    <button type="submit">
        🗑 Delete Hotel
    </button>
    </form>
</div>
</body>
</html>
